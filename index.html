<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon Grimoire Personnel</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,700&display=swap" rel="stylesheet">
</head>
<body>

    <h1>Mon Grimoire</h1>

    <nav>
        <button class="btn-nav" onclick="filtrer('all')">Tout voir</button>
        <button class="btn-nav" onclick="filtrer('film')">Films</button>
        <button class="btn-nav" onclick="filtrer('serie')">Séries</button>
        <button class="btn-nav" onclick="filtrer('livre')">Livres</button>
        <button class="btn-nav" onclick="filtrer('webtoon')">Webtoons</button>
        
        <select class="select-filtre" onchange="filtrerParNote(this.value)">
            <option value="tous">Toutes les notes</option>
            <option value="5">★★★★★ (5)</option>
            <option value="4.5">★★★★½ (4.5)</option>
            <option value="4">★★★★ (4)</option>
            <option value="3.5">★★★½ (3.5)</option>
            <option value="3">★★★ (3)</option>
        </select>
    </nav>

    <div id="galerie"></div>

    <button id="btn-ajouter" onclick="ouvrirFormulaire()"> + </button>

    <div id="modale">
        <div class="modale-contenu">
            <h2 style="color:var(--or); font-family:var(--font-titre); margin-top:0;">Nouvelle Entrée</h2>
            <input type="text" id="titre" placeholder="Titre de l'oeuvre">
            <input type="file" id="fileImg" accept="image/*">
            <input type="text" id="urlImg" placeholder="Ou lien (URL) de l'image">
            <select id="cat">
                <option value="film">Film</option>
                <option value="serie">Série</option>
                <option value="livre">Livre</option>
                <option value="webtoon">Webtoon</option>
            </select>
            <input type="number" id="note" placeholder="Note (ex: 4.5)" step="0.5" min="0" max="5">
            <button class="btn-or" onclick="preparerSauvegarde()">Inscrire au Grimoire</button>
            <button onclick="fermerFormulaire()" style="background:none; color:grey; border:none; cursor:pointer;">Annuler</button>
        </div>
    </div>

    <script>
        let data = JSON.parse(localStorage.getItem('grimoirePolarisV4')) || [];
        let catActuelle = 'all';

        function afficher(liste) {
            const gal = document.getElementById('galerie');
            gal.innerHTML = "";
            liste.forEach((item, index) => {
                const div = document.createElement('div');
                div.className = 'carte';
                div.onclick = (e) => {
                    if(e.target.className !== 'btn-supprimer') div.classList.toggle('active-note');
                }

                let etoiles = "★".repeat(Math.floor(item.note)) + (item.note % 1 !== 0 ? "½" : "");
                
                div.innerHTML = `
                    <img src="${item.image}">
                    <div class="overlay-note">
                        <h2 style="font-family:var(--font-titre); color:var(--or-brillant);">${item.titre}</h2>
                        <div class="etoiles">${etoiles}</div>
                        <p>${item.note} / 5</p>
                        <button class="btn-supprimer" onclick="supprimer(${index})">Supprimer</button>
                    </div>
                `;
                gal.appendChild(div);
            });
        }

        function preparerSauvegarde() {
            const file = document.getElementById('fileImg').files[0];
            const url = document.getElementById('urlImg').value;
            
            if (file) {
                const reader = new FileReader();
                reader.onload = (e) => sauvegarder(e.target.result);
                reader.readAsDataURL(file);
            } else {
                sauvegarder(url || 'https://via.placeholder.com/220x330?text=Image');
            }
        }

        function sauvegarder(imgSrc) {
            const item = {
                titre: document.getElementById('titre').value || "Sans titre",
                image: imgSrc,
                categorie: document.getElementById('cat').value,
                note: parseFloat(document.getElementById('note').value) || 0
            };
            data.push(item);
            localStorage.setItem('grimoirePolarisV4', JSON.stringify(data));
            afficher(data);
            fermerFormulaire();
        }

        function supprimer(i) {
            if(confirm("Supprimer cette entrée ?")) {
                data.splice(i, 1);
                localStorage.setItem('grimoirePolarisV4', JSON.stringify(data));
                filtrer(catActuelle);
            }
        }

        function filtrer(c) {
            catActuelle = c;
            afficher(c === 'all' ? data : data.filter(i => i.categorie === c));
        }

        function filtrerParNote(n) {
            let base = catActuelle === 'all' ? data : data.filter(i => i.categorie === catActuelle);
            afficher(n === 'tous' ? base : base.filter(i => i.note == parseFloat(n)));
        }

        function ouvrirFormulaire() { document.getElementById('modale').style.display = 'flex'; }
        function fermerFormulaire() { document.getElementById('modale').style.display = 'none'; }

        afficher(data);
    </script>
</body>
</html>
